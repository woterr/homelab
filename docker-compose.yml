services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - LISTEN_ADDR=:8000
      - HOST_SYS=/host/sys
      - HOST_PROC=/host/proc
      - HOST_DOCKER=/host/docker.sock
      - HOST_ROOT=/host/root
    volumes:
      - ./data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /dev:/host/dev:ro
      - /var/run/docker.sock:/host/docker.sock:ro
    cap_add:
      - NET_RAW
    init: true

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/homelab:ro
    depends_on:
      - backend
